plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.grabfood'
version = '1.0.0'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Web Starter
    implementation 'org.springframework.boot:spring-boot-starter-web'
    
    // Spring Cache Abstraction
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    
    // Spring Data Redis (Tự động kéo theo Lettuce Driver non-blocking)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    
    // Connection Pool cho Lettuce (Apache Commons Pool 2)
    implementation 'org.apache.commons:commons-pool2'
    
    // Jackson Datatype JSR310 cho xử lý Java 8 Date/Time trong JSON
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    
    // Lombok hỗ trợ sinh code ngắn gọn
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
