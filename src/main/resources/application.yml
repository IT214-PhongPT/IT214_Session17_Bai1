spring:
  application:
    name: grabfood-cache-service
  data:
    redis:
      host: localhost         
      port: 6379             
      timeout: 2000ms        
      lettuce:
        pool:
          max-active: 10     
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms

server:
  port: 8080

logging:
  level:
    com.grabfood.cache: DEBUG
    org.springframework.data.redis: INFO
    org.springframework.cache: DEBUG
